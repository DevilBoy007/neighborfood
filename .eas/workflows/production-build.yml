name: Production Build & Submit

# The only workflow that builds automatically: pushing a version tag (e.g. v1.0.0).
# Bump "version" in app.json before tagging; build numbers auto-increment remotely.
on:
  push:
    tags: ['v*']

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  # Uploads to the Play Console internal track and App Store Connect (TestFlight).
  # Promote to production from the store consoles after review.
  submit_android:
    name: Submit to Google Play (internal)
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
