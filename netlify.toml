[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # These EXPO_PUBLIC_* vars are intentionally bundled into client-side JS (that's what the prefix means).
  # Tell Netlify's secrets scanner not to flag them as leaked secrets.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_API_KEY,EXPO_PUBLIC_APP_ID,EXPO_PUBLIC_AUTH_DOMAIN,EXPO_PUBLIC_DATABASE_URL,EXPO_PUBLIC_GOOGLE_MAPS_API_KEY,EXPO_PUBLIC_MEASUREMENT_ID,EXPO_PUBLIC_MESSAGING_SENDER_ID,EXPO_PUBLIC_MESSAGING_SERVER_KEY,EXPO_PUBLIC_PROJECT_ID,EXPO_PUBLIC_STORAGE_BUCKET,EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY,EXPO_PUBLIC_VAPID_KEY,EXPO_PUBLIC_APN_KEY_ID,EXPO_PUBLIC_APPLE_DEVELOPMENT_TEAM_ID"

# Serve the Stripe redirect pages regardless of SPA routing
[[headers]]
  for = "/stripe-return.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/stripe-refresh.html"
  [headers.values]
    Cache-Control = "no-store"

# SPA fallback — let expo-router handle client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
