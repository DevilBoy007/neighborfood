name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One install for every app check keeps runner minutes low.
  app:
    name: App (lint, format, types, tests, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: File hygiene (pre-commit)
        run: |
          pip install pre-commit
          SKIP=eslint,typescript,prettier pre-commit run --all-files --show-diff-on-failure

      - run: npm run lint

      - run: npm run format:check

      - name: TypeScript
        run: npm run typecheck
        continue-on-error: true # TODO: make blocking once legacy type errors are fixed

      - run: npm test -- --ci

      - name: Verify Expo config
        run: npx expo config --type public > /dev/null

      - name: Bundle native JavaScript
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          CI: true

  functions:
    name: Cloud Functions (build, emulator tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # matches the Cloud Functions runtime in functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15

      - run: npm ci

      - run: npm run build

      - run: npm run test:emulators
