name: 'Copilot Setup Steps'

# Provisions the GitHub Copilot coding agent's environment. Keep tool versions in sync
# with .devcontainer/devcontainer.json and .devcontainer/post-create.sh.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (app toolchain)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python (pre-commit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Install CLIs
        run: npm install --global firebase-tools@15 eas-cli

      - name: Install pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit install

      - name: Pre-download Firebase emulators
        run: firebase setup:emulators:firestore && firebase setup:emulators:storage
